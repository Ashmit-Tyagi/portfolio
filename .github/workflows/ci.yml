name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image (sanity check)
        run: docker build -t portfolio-site:ci .

      - name: Confirm nginx serves index.html
        run: |
          docker run -d --name test-container -p 8080:80 portfolio-site:ci
          sleep 2
          curl -sf http://localhost:8080/ | grep -qi "Ashmit Tyagi" && echo "Site content check passed"
          docker stop test-container
